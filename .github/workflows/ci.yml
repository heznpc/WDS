name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          node --version

      - name: Test Swift packages
        run: |
          set -euo pipefail
          for pkg in \
            native/WDSApp \
            native/WDSAxBridge \
            native/WDSSensor \
            native/WDSWhack \
            native/WDSTerminalAdapter; do
            [ -f "$pkg/Package.swift" ] || continue
            echo "::group::swift test $pkg"
            swift test --package-path "$pkg"
            echo "::endgroup::"
          done

      - name: JS tests
        run: npm test

      - name: Build and sign the app bundle
        run: ./scripts/build-wds-app.sh
